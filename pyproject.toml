[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clockify-utils"
version = "1.0.0"
description = "Shared Clockify utilities: API client, `clockify` CLI, weekly auto-fill, reports and gaps"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
clockify = "clockify_utils.cli:main"

[tool.setuptools]
packages = ["clockify_utils"]
